import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
    id("com.diffplug.spotless") version "6.25.0"
    id 'org.panteleyev.jpackageplugin' version '2.1.0'
}

group = 'me.pintoadmin'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.googlecode.lanterna:lanterna:3.1.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'me.pintoadmin.cardTerminal.Main'
    }
}

spotless {
    java {
        googleJavaFormat("1.28.0").aosp()
        target(
                "src/main/java/**/*.java",
        )
        removeUnusedImports()
        formatAnnotations()
        trimTrailingWhitespace()
        toggleOffOn("// @formatter:off", "// @formatter:on")
    }
}

tasks.named('shadowJar', ShadowJar) {
    relocate 'com.googlecode.lanterna', 'me.pintoadmin.lanterna'
    archiveClassifier.set('')
}

compileJava.dependsOn spotlessApply
build.dependsOn shadowJar

def jpackageInputDir = layout.buildDirectory.dir("jpackage-input")
def jpackageOutputDir = layout.buildDirectory.dir("jpackage")
def osName = System.getProperty("os.name").toLowerCase()

tasks.register('stageJpackageInput', Sync) {
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    from(tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
    into jpackageInputDir
}

tasks.named('jpackage') {
    dependsOn tasks.named('build'), tasks.named('stageJpackageInput')

    appName = "CardTerminal"
    appVersion = "${version}"
    description = "A card table, but terminal..."
    vendor = "PintoAdmin"
    destination = jpackageOutputDir

    input = jpackageInputDir
    mainClass = 'me.pintoadmin.cardTerminal.Main'
    mainJar = "CardTerminal-${version}.jar"

//    dependsOn installDist

    // DYNAMIC SPECIFICATION BASED ON RUNTIME ENVIRONMENT
    if (osName.contains("windows")) {
        type = org.panteleyev.jpackage.ImageType.MSI // Outputs .msi
        windows {
            winConsole = false
            winMenu = true
            winShortcut = true
        }
    } else if (osName.contains("mac")) {
        type = org.panteleyev.jpackage.ImageType.DMG // Outputs .dmg
        mac {
            macPackageName = "CardTerminal"
        }
    } else if (osName.contains("linux")) {
        type = org.panteleyev.jpackage.ImageType.DEB // Outputs .deb
        linux {
            linuxShortcut = true
        }
    }
}

tasks.register('copyJpackageArtifact', Copy) {
    dependsOn tasks.named('jpackage')
    into layout.buildDirectory.dir("libs")

    if (osName.contains("windows")) {
        from(jpackageOutputDir.map { it.file("CardTerminal/CardTerminal.exe") })
    } else if (osName.contains("mac")) {
        from(jpackageOutputDir) {
            include("*.dmg")
        }
    } else if (osName.contains("linux")) {
        from(jpackageOutputDir) {
            include("*.deb")
        }
    }
}

tasks.named('jpackage') {
    finalizedBy tasks.named('copyJpackageArtifact')
}
